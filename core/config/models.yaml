models:
  bs_roformer:
    repo: "https://github.com/ZFTurbo/Music-Source-Separation-Training.git"
    branch: "main"
    target_dir: "models/bs_roformer"

    train_script: "train.py"
    infer_script: "inference.py"
    config_path: "configs/config_vocals_bs_roformer.yaml"

    run_setup: true
    setup:
      - "pip install -r requirements.txt"

