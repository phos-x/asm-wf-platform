experiments:
  exp_bs_roformer_mel:
    model: "bs_roformer"
    dataset: "musdb18"
    
    mlflow_experiment: "stem_separation_baselines"
    
    # Execution (Remember, $DATASET_DIR is injected by the orchestrator!)
    cmd: "python train.py --data_path $DATASET_DIR/train"
    extra_args: "--dataset_type 1
     --model_type bs_roformer
     --config configs/config_musdb18_bs_roformer.yaml
     --results_path results/
     --num_workers 5
     --valid_path $DATASET_DIR/test
     --device_ids 0 "

  exp_bs_roformer_vocals:
    model: "bs_roformer"
    dataset: "vocals_only_v1"
    cmd: "python train.py --data_path $DATASET_DIR"
    extra_args: "--dataset_type 2 --target_instrument vocals"